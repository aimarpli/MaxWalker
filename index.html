<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxWalker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Apple Liquid Glass Effect */
        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .glass-button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
        }

        /* Modal Background */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }

        /* Timer Circle Animation */
        .timer-circle {
            transition: all 0.5s ease;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5), 0 0 30px rgba(99, 102, 241, 0.2);
        }
        .timer-active {
            box-shadow: inset 0 0 30px rgba(0,0,0,0.3), 0 0 50px rgba(99, 102, 241, 0.6);
            border-color: #6366f1;
            animation: pulse-border 2s infinite;
        }
        .timer-finished {
            box-shadow: inset 0 0 30px rgba(0,0,0,0.3), 0 0 30px rgba(16, 185, 129, 0.4);
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
        .timer-flagged {
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 0 40px rgba(239, 68, 68, 0.5);
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(99, 102, 241, 0); }
            100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
        }

        .flagged-walk {
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: rgba(239, 68, 68, 0.3) !important;
        }
    </style>
</head>
<body>
    <div id="app" class="min-h-screen"></div>
    <div id="modal-root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Variables de Firebase
        let app, auth, db, stateDocRef;
        let isDbReady = false;

        // State Management
        let state = {
            users: [],
            currentUser: null,
            view: 'login', // login, app
            activeTab: 'calendar', // calendar, stats, admin
            currentDate: new Date(),
            walks: {}, // { "YYYY-MM-DD": [walks] }
            defaultSchedule: {
                // 1: Mon, 2: Tue, 3: Wed, 4: Thu, 5: Fri, 6: Sat, 0: Sun
                1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 0: []
            },
            notifications: [],
            swapRequests: [],
            
            // UI States
            activeTimerId: null,
            activeTimerStart: null,
            timerInterval: null
        };

        let loginState = {
            step: 'user', // 'user' o 'pin'
            username: '',
            pin: '',
            error: false
        };

        const MIN_SHORT_WALK = 10 * 60; // 10 minutes in seconds
        const MIN_LONG_WALK = 60 * 60; // 60 minutes in seconds

        // Exportamos al scope global para que los onclick de HTML funcionen
        window.state = state;
        window.loginState = loginState;

        async function initFirebase() {
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'maxwalker-default-id';
                const firebaseConfig = {
                    apiKey: "AIzaSyAyLqdIbmEZeLk6hFIKXVWHhgA37vgX9sw",
                    authDomain: "dogwalker-pl.firebaseapp.com",
                    projectId: "dogwalker-pl",
                    storageBucket: "dogwalker-pl.firebasestorage.app",
                    messagingSenderId: "531303785074",
                    appId: "1:531303785074:web:ece0891cfebc06ac8218eb",
                    measurementId: "G-MJPHBFNK54"
                };

                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                
                // Usaremos un único documento para guardar todo el estado debido a la estructura de la app
                stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'maxwalker_state', 'main');

                const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                try {
                    if (initialToken) {
                        await signInWithCustomToken(auth, initialToken);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch (authError) {
                    console.warn("Authentication failed with provided token, falling back to anonymous auth:", authError);
                    await signInAnonymously(auth);
                }

                // Listener en tiempo real de Firestore
                onSnapshot(stateDocRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        state.users = data.users || [];
                        state.walks = data.walks || {};
                        state.defaultSchedule = data.defaultSchedule || { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 0: [] };
                        state.notifications = data.notifications || [];
                        state.swapRequests = data.swapRequests || [];
                        
                        // Si hay un usuario logueado, actualizar su referencia por si su rol/pin cambió
                        if (state.currentUser) {
                            state.currentUser = state.users.find(u => u.username === state.currentUser.username) || state.currentUser;
                        }
                    }
                    isDbReady = true;
                    render();
                }, (error) => {
                    console.error("Firestore sync error:", error);
                    isDbReady = true;
                    render(); // Renderizar aunque haya error
                });

            } catch (e) {
                console.error("Firebase init failed:", e);
                isDbReady = true;
                render();
            }
        }

        async function saveData() {
            if (!auth || !auth.currentUser || !stateDocRef) return;
            const dataToSave = {
                users: state.users,
                walks: state.walks,
                defaultSchedule: state.defaultSchedule,
                notifications: state.notifications,
                swapRequests: state.swapRequests
            };
            try {
                await setDoc(stateDocRef, dataToSave);
            } catch (e) {
                console.error("Error saving data:", e);
            }
        }

        // Utility: Generate Unique IDs
        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function formatDateKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function formatDisplayDate(date) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            let str = date.toLocaleDateString('es-ES', options);
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            if (h > 0) return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function addNotification(userId, type, message, reqId = null) {
            state.notifications.unshift({
                id: generateId(),
                userId,
                type,
                message,
                timestamp: new Date().toISOString(),
                relatedReqId: reqId,
                read: false
            });
            saveData();
        }

        function notifyAdmins(message) {
            state.users.filter(u => u.role === 'admin').forEach(admin => {
                addNotification(admin.username, 'alert', message);
            });
        }

        function render() {
            const app = document.getElementById('app');
            
            if (!isDbReady) {
                app.innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-screen p-4 text-center">
                        <i class="ph ph-spinner-gap text-5xl text-indigo-500 animate-spin mb-4"></i>
                        <p class="text-slate-400 font-medium animate-pulse">Conectando a la nube...</p>
                    </div>
                `;
                return;
            }

            if (state.users.length === 0) {
                app.innerHTML = renderFirstAdmin();
                return;
            }

            if (state.view === 'login') {
                app.innerHTML = renderLogin();
            } else if (state.view === 'app') {
                app.innerHTML = `
                    ${renderNavbar()}
                    <main class="max-w-5xl mx-auto px-4 md:px-6 pb-20 pt-6">
                        ${state.activeTab === 'calendar' ? renderCalendar() : state.activeTab === 'stats' ? renderStats() : renderAdmin()}
                    </main>
                `;
            }
        }
        window.render = render;

        function renderFirstAdmin() {
            return `
                <div class="flex items-center justify-center min-h-screen p-4">
                    <div class="glass-panel p-8 rounded-3xl w-full max-w-md text-center">
                        <i class="ph ph-cloud-check text-6xl text-indigo-400 mb-4"></i>
                        <h1 class="text-3xl font-bold text-white mb-2">MaxWalker Cloud</h1>
                        <p class="text-slate-400 mb-8">Base de datos iniciada. Crea el primer administrador del sistema.</p>
                        
                        <form onsubmit="handleFirstAdmin(event)" class="space-y-4">
                            <input type="text" id="adminUser" placeholder="Usuario" required class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                            <input type="password" inputmode="numeric" pattern="[0-9]*" id="adminPin" placeholder="PIN numérico" required class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg shadow-indigo-500/30">
                                Crear Sistema
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function handleFirstAdmin(e) {
            e.preventDefault();
            const user = document.getElementById('adminUser').value.trim();
            const pin = document.getElementById('adminPin').value.trim();
            
            if (user && pin) {
                state.users.push({ username: user, pin: pin, role: 'admin' });
                saveData();
                state.currentUser = state.users[0];
                state.view = 'app';
                state.activeTab = 'calendar';
                render();
            }
        }

        function renderLogin() {
            if (loginState.step === 'user') {
                return `
                    <div class="flex items-center justify-center min-h-screen p-4 relative overflow-hidden">
                        <div class="absolute w-96 h-96 bg-indigo-600/20 rounded-full blur-[100px] top-10 left-10"></div>
                        <div class="absolute w-96 h-96 bg-purple-600/20 rounded-full blur-[100px] bottom-10 right-10"></div>

                        <div class="glass-panel p-8 rounded-3xl w-full max-w-sm text-center relative z-10">
                            <div class="w-20 h-20 mx-auto bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center mb-6 shadow-xl transform rotate-3 overflow-hidden">
                                <img src="icon.png" alt="MaxWalker Icon" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                <i class="ph ph-dog text-4xl text-white" style="display:none;"></i>
                            </div>
                            <h1 class="text-3xl font-bold text-white mb-2 tracking-tight">MaxWalker</h1>
                            <div class="text-xs text-indigo-400 mb-6 font-semibold"><i class="ph ph-cloud"></i> Cloud Sync</div>
                            
                            <form onsubmit="handleLoginUser(event)" class="space-y-4">
                                <input type="text" id="loginUser" placeholder="Usuario" required class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
                                <div id="loginError" class="text-red-400 text-sm hidden">Usuario no encontrado</div>
                                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg shadow-indigo-500/30 mt-4">
                                    Continuar
                                </button>
                            </form>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="flex items-center justify-center min-h-screen p-4 relative overflow-hidden">
                        <div class="absolute w-96 h-96 bg-indigo-600/20 rounded-full blur-[100px] top-10 left-10"></div>
                        <div class="absolute w-96 h-96 bg-purple-600/20 rounded-full blur-[100px] bottom-10 right-10"></div>

                        <div class="glass-panel p-8 rounded-3xl w-full max-w-sm text-center relative z-10">
                            <h2 class="text-2xl font-bold text-white mb-2">Hola, ${loginState.username}</h2>
                            <p class="text-slate-400 text-sm mb-6">Ingresa tu PIN numérico</p>
                            
                            <div class="flex justify-center items-center gap-3 mb-8 h-6">
                                ${loginState.pin.length === 0 ? `<span class="text-slate-500 text-sm animate-pulse">Usa el teclado o botones</span>` : 
                                  Array.from({length: loginState.pin.length}).map(() => `<div class="w-4 h-4 rounded-full bg-indigo-400 shadow-[0_0_10px_rgba(99,102,241,0.8)]"></div>`).join('')}
                            </div>

                            ${loginState.error ? `<div class="text-red-400 text-sm mb-4 animate-bounce">PIN incorrecto</div>` : ''}

                            <div class="grid grid-cols-3 gap-4 max-w-[240px] mx-auto">
                                ${[1,2,3,4,5,6,7,8,9].map(n => `
                                    <button onclick="handlePinInput('${n}')" class="w-16 h-16 rounded-full bg-white/5 border border-white/10 text-xl font-medium text-white hover:bg-white/10 active:bg-white/20 transition-all flex items-center justify-center mx-auto">${n}</button>
                                `).join('')}
                                <button onclick="handlePinBackspace()" class="w-16 h-16 rounded-full bg-white/5 border border-white/10 text-xl font-medium text-slate-400 hover:text-white hover:bg-white/10 active:bg-white/20 transition-all flex items-center justify-center mx-auto"><i class="ph ph-backspace"></i></button>
                                <button onclick="handlePinInput('0')" class="w-16 h-16 rounded-full bg-white/5 border border-white/10 text-xl font-medium text-white hover:bg-white/10 active:bg-white/20 transition-all flex items-center justify-center mx-auto">0</button>
                                <button onclick="handlePinSubmit()" class="w-16 h-16 rounded-full bg-indigo-600 border border-indigo-500/50 text-xl font-medium text-white hover:bg-indigo-500 active:bg-indigo-400 transition-all shadow-[0_0_15px_rgba(79,70,229,0.4)] flex items-center justify-center mx-auto"><i class="ph-bold ph-check"></i></button>
                            </div>
                            
                            <button onclick="loginState.step = 'user'; loginState.pin = ''; loginState.error = false; render()" class="mt-8 text-sm text-slate-400 hover:text-white transition-colors">Cambiar usuario</button>
                        </div>
                    </div>
                `;
            }
        }

        function handleLoginUser(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value.trim();
            
            const found = state.users.find(u => u.username.toLowerCase() === user.toLowerCase());
            if (found) {
                loginState.step = 'pin';
                loginState.username = found.username;
                loginState.pin = '';
                loginState.error = false;
                render();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function handlePinInput(num) {
            if (loginState.pin.length < 10) { 
                loginState.pin += num;
                loginState.error = false;
                render();
            }
        }

        function handlePinBackspace() {
            if (loginState.pin.length > 0) {
                loginState.pin = loginState.pin.slice(0, -1);
                loginState.error = false;
                render();
            }
        }

        function handlePinSubmit() {
            const found = state.users.find(u => u.username === loginState.username && u.pin === loginState.pin);
            if (found) {
                state.currentUser = found;
                state.view = 'app';
                state.activeTab = 'calendar';
                
                loginState.step = 'user';
                loginState.username = '';
                loginState.pin = '';
                
                render();
            } else {
                loginState.error = true;
                loginState.pin = ''; 
                render();
            }
        }

        function logout() {
            state.currentUser = null;
            state.view = 'login';
            render();
        }

        function renderNavbar() {
            const myNotifs = state.notifications.filter(n => n.userId === state.currentUser.username);
            const unreadCount = myNotifs.filter(n => !n.read).length;

            return `
                <nav class="sticky top-0 z-40 bg-[#0f172a]/80 backdrop-blur-xl border-b border-white/10">
                    <div class="max-w-5xl mx-auto px-4 md:px-6 h-16 flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg overflow-hidden">
                                <img src="icon.png" alt="MaxWalker Icon" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                                <i class="ph ph-dog text-xl text-white" style="display:none;"></i>
                            </div>
                            <span class="font-bold text-xl tracking-tight hidden sm:block text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">MaxWalker</span>
                        </div>
                        
                        <div class="flex items-center gap-1 sm:gap-2">
                            <button onclick="state.activeTab = 'calendar'; render()" class="px-3 sm:px-4 py-2 rounded-xl text-sm font-semibold transition-all ${state.activeTab === 'calendar' ? 'bg-indigo-500/20 text-indigo-300' : 'text-slate-400 hover:text-white'}">
                                <i class="ph ph-calendar-blank mr-1"></i> <span class="hidden sm:inline">Calendario</span>
                            </button>
                            <button onclick="state.activeTab = 'stats'; render()" class="px-3 sm:px-4 py-2 rounded-xl text-sm font-semibold transition-all ${state.activeTab === 'stats' ? 'bg-indigo-500/20 text-indigo-300' : 'text-slate-400 hover:text-white'}">
                                <i class="ph ph-chart-bar mr-1"></i> <span class="hidden sm:inline">Estadísticas</span>
                            </button>
                            ${state.currentUser?.role === 'admin' ? `
                                <button onclick="state.activeTab = 'admin'; render()" class="px-3 sm:px-4 py-2 rounded-xl text-sm font-semibold transition-all ${state.activeTab === 'admin' ? 'bg-indigo-500/20 text-indigo-300' : 'text-slate-400 hover:text-white'}">
                                    <i class="ph ph-shield-star mr-1"></i> <span class="hidden sm:inline">Admin</span>
                                </button>
                            ` : ''}
                        </div>

                        <div class="flex items-center gap-3">
                            <button onclick="openNotifications()" class="relative p-2 text-slate-400 hover:text-white transition-colors">
                                <i class="ph ph-bell text-xl"></i>
                                ${unreadCount > 0 ? `<span class="absolute top-1 right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-[#0f172a]"></span>` : ''}
                            </button>
                            <button onclick="logout()" class="p-2 text-slate-400 hover:text-red-400 transition-colors">
                                <i class="ph ph-sign-out text-xl"></i>
                            </button>
                        </div>
                    </div>
                </nav>
            `;
        }

        function renderCalendar() {
            const dateKey = formatDateKey(state.currentDate);
            const dayOfWeek = state.currentDate.getDay();
            
            let defaultForDay = state.defaultSchedule[dayOfWeek] || [];
            let specificForDay = state.walks[dateKey] || [];
            
            // Instanciar valores por defecto y guardar
            if (specificForDay.length === 0 && defaultForDay.length > 0) {
                specificForDay = defaultForDay.map(d => ({
                    id: generateId(),
                    time: d.time,
                    walker: d.walker,
                    type: d.type,
                    status: 'pending',
                    duration: 0,
                    isDefaultInstantiated: true
                }));
                state.walks[dateKey] = specificForDay;
                saveData();
            }

            let todayWalks = [...(state.walks[dateKey] || [])];
            todayWalks.sort((a, b) => a.time.localeCompare(b.time));

            return `
                <div class="space-y-6 animate-fade-in text-left">
                    <div class="flex items-center justify-between bg-[#1e293b]/50 backdrop-blur-md border border-white/5 rounded-2xl p-4 shadow-lg">
                        <button onclick="changeDay(-1)" class="p-3 bg-white/5 hover:bg-white/10 rounded-xl transition-all text-slate-300">
                            <i class="ph ph-caret-left text-xl"></i>
                        </button>
                        
                        <div class="text-center flex-1">
                            <h2 class="text-2xl font-bold text-white capitalize">${formatDisplayDate(state.currentDate)}</h2>
                            ${dateKey === formatDateKey(new Date()) ? `<span class="text-xs font-semibold bg-indigo-500/20 text-indigo-300 px-2 py-1 rounded-md uppercase tracking-wider mt-1 inline-block">Hoy</span>` : ''}
                        </div>

                        <button onclick="changeDay(1)" class="p-3 bg-white/5 hover:bg-white/10 rounded-xl transition-all text-slate-300">
                            <i class="ph ph-caret-right text-xl"></i>
                        </button>
                    </div>

                    ${state.currentUser.role === 'admin' ? `
                        <button onclick="openAddWalkModal()" class="w-full glass-button p-4 rounded-2xl text-slate-300 flex items-center justify-center gap-2 border-dashed border-white/20 hover:border-indigo-400/50 hover:text-indigo-300">
                            <i class="ph ph-plus-circle text-xl"></i> Añadir Paseo Extra
                        </button>
                    ` : ''}

                    <div class="space-y-3">
                        ${todayWalks.length === 0 ? `
                            <div class="text-center p-10 glass-panel rounded-3xl text-slate-500">
                                <i class="ph ph-moon-stars text-5xl mb-3 opacity-50"></i>
                                <p>No hay paseos programados para este día.</p>
                            </div>
                        ` : todayWalks.map(walk => {
                            let isFlagged = false;
                            if (walk.status === 'completed') {
                                if (walk.type === 'Corto' && walk.duration < MIN_SHORT_WALK) isFlagged = true;
                                if (walk.type === 'Largo' && walk.duration < MIN_LONG_WALK) isFlagged = true;
                            }

                            const statusColors = {
                                pending: 'border-white/10 hover:border-indigo-500/50',
                                active: 'border-indigo-500 shadow-[0_0_20px_rgba(99,102,241,0.3)] bg-indigo-900/20',
                                completed: isFlagged ? 'border-red-500/50 flagged-walk' : 'border-emerald-500/50 bg-emerald-900/10'
                            };

                            const iconColors = {
                                pending: 'text-slate-400',
                                active: 'text-indigo-400 animate-pulse',
                                completed: isFlagged ? 'text-red-400' : 'text-emerald-400'
                            };

                            return `
                            <div onclick="openTimerModal('${dateKey}', '${walk.id}')" class="glass-panel p-4 rounded-2xl cursor-pointer transition-all duration-300 ${statusColors[walk.status]} group flex items-center justify-between">
                                <div class="flex items-center gap-4">
                                    <div class="w-14 h-14 rounded-full bg-black/40 flex items-center justify-center border border-white/5">
                                        <i class="ph ${walk.type === 'Largo' ? 'ph-sneaker' : 'ph-paw-print'} text-2xl ${iconColors[walk.status]}"></i>
                                    </div>
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <h4 class="text-xl font-bold text-white">${walk.time}</h4>
                                            <span class="text-xs px-2 py-0.5 rounded-full ${walk.type === 'Largo' ? 'bg-purple-500/20 text-purple-300' : 'bg-blue-500/20 text-blue-300'} font-medium border border-white/10">${walk.type}</span>
                                        </div>
                                        <div class="text-slate-400 text-sm flex items-center gap-1 mt-0.5">
                                            <i class="ph ph-user"></i> ${walk.walker}
                                        </div>
                                    </div>
                                </div>
                                <div class="flex items-center gap-4 text-right">
                                    ${walk.status === 'completed' ? `
                                        <div>
                                            <div class="text-lg font-mono font-bold ${isFlagged ? 'text-red-400' : 'text-emerald-400'}">${formatTime(walk.duration)}</div>
                                            <div class="text-xs text-slate-500 flex items-center gap-1 justify-end"><i class="ph ph-check-circle"></i> por ${walk.completedBy || walk.walker}</div>
                                        </div>
                                    ` : walk.status === 'active' ? `
                                        <div class="text-indigo-400 flex items-center gap-2 font-semibold">
                                            <i class="ph ph-spinner-gap animate-spin"></i> En curso
                                        </div>
                                    ` : `
                                        <i class="ph ph-caret-right text-slate-500 group-hover:text-indigo-400 transition-colors"></i>
                                    `}
                                </div>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function changeDay(offset) {
            state.currentDate.setDate(state.currentDate.getDate() + offset);
            render();
        }

        function openAddWalkModal() {
            const modalRoot = document.getElementById('modal-root');
            const usersOpts = state.users.map(u => `<option value="${u.username}">${u.username}</option>`).join('');
            
            modalRoot.innerHTML = `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div class="absolute inset-0 modal-overlay" onclick="closeModal()"></div>
                    <div class="glass-panel w-full max-w-sm rounded-3xl p-6 relative z-10 animate-fade-in text-left border border-indigo-500/30">
                        <h3 class="text-xl font-bold text-white mb-4">Añadir Paseo</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Hora</label>
                                <input type="time" id="newTime" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-indigo-500 focus:outline-none" required>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Paseador</label>
                                <select id="newWalker" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-indigo-500 focus:outline-none">
                                    ${usersOpts}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Tipo</label>
                                <select id="newType" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-indigo-500 focus:outline-none">
                                    <option value="Corto">Corto (Mín 10m)</option>
                                    <option value="Largo">Largo (Mín 1h)</option>
                                </select>
                            </div>
                            <div class="pt-2 flex gap-3">
                                <button onclick="closeModal()" class="flex-1 py-3 px-4 rounded-xl text-slate-300 bg-white/5 hover:bg-white/10 font-semibold transition-all">Cancelar</button>
                                <button onclick="saveNewWalk()" class="flex-1 py-3 px-4 rounded-xl text-white bg-indigo-600 hover:bg-indigo-500 font-bold shadow-lg shadow-indigo-500/30 transition-all">Guardar</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveNewWalk() {
            const time = document.getElementById('newTime').value;
            const walker = document.getElementById('newWalker').value;
            const type = document.getElementById('newType').value;
            
            if (!time) return;

            const dateKey = formatDateKey(state.currentDate);
            if (!state.walks[dateKey]) state.walks[dateKey] = [];
            
            state.walks[dateKey].push({
                id: generateId(),
                time,
                walker,
                type,
                status: 'pending',
                duration: 0
            });
            
            saveData();
            closeModal();
            render();
        }

        let timerDisplayInterval;
        
        function openTimerModal(dateKey, walkId) {
            const walk = (state.walks[dateKey] || []).find(w => w.id === walkId);
            if (!walk) return;

            const modalRoot = document.getElementById('modal-root');
            let isFlagged = false;
            let minRequiredText = walk.type === 'Corto' ? 'Mínimo 10 min' : 'Mínimo 1 hora';
            let minReqSeconds = walk.type === 'Corto' ? MIN_SHORT_WALK : MIN_LONG_WALK;
            const isToday = dateKey === formatDateKey(new Date());

            if (walk.status === 'completed') {
                if (walk.duration < minReqSeconds) isFlagged = true;
            }

            modalRoot.innerHTML = `
                <div class="fixed inset-0 z-50 flex flex-col items-center justify-center p-4">
                    <div class="absolute inset-0 modal-overlay" onclick="closeModal()"></div>
                    <div class="relative z-10 text-center w-full max-w-sm">
                        
                        <div class="bg-black/60 backdrop-blur-xl border border-white/10 rounded-3xl p-4 mb-8 shadow-2xl inline-block text-left mx-auto w-full">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-white font-bold text-xl">${walk.time}</span>
                                <span class="text-xs px-2 py-1 rounded-lg bg-white/10 text-slate-300 uppercase tracking-wider">${walk.type}</span>
                            </div>
                            <div class="text-slate-400 text-sm"><i class="ph ph-user"></i> Asignado a: <span class="text-white">${walk.walker}</span></div>
                            <div class="text-xs text-indigo-400 mt-1"><i class="ph ph-info"></i> ${minRequiredText}</div>
                        </div>

                        <button id="giantTimerBtn" onclick="${isToday || walk.status !== 'pending' ? `toggleTimer('${dateKey}', '${walkId}')` : ''}" class="w-64 h-64 rounded-full border-4 border-slate-700 bg-[#0f172a] timer-circle flex flex-col items-center justify-center mx-auto relative overflow-hidden group outline-none ${walk.status === 'active' ? 'timer-active' : ''} ${walk.status === 'completed' && !isFlagged ? 'timer-finished' : ''} ${isFlagged ? 'timer-flagged' : ''} ${!isToday && walk.status === 'pending' ? 'cursor-not-allowed opacity-75' : ''}">
                            
                            ${walk.status === 'pending' ? `
                                ${isToday ? `
                                    <i class="ph ph-play-circle text-6xl text-indigo-400 group-hover:scale-110 transition-transform mb-2"></i>
                                    <span class="text-slate-300 font-bold uppercase tracking-widest">Iniciar</span>
                                ` : `
                                    <i class="ph ph-lock-key text-5xl text-slate-500 mb-2"></i>
                                    <span class="text-slate-400 font-bold uppercase tracking-widest text-xs mt-3 px-6">Solo disponible hoy</span>
                                `}
                            ` : walk.status === 'active' ? `
                                <div class="absolute inset-0 bg-indigo-500/10 animate-pulse"></div>
                                <div id="timerDisplay" class="text-5xl font-mono font-bold text-white relative z-10 tracking-tighter">
                                    00:00:00
                                </div>
                                <span class="text-indigo-300 text-xs uppercase tracking-widest mt-2 relative z-10 flex items-center gap-1"><i class="ph ph-stop-circle text-lg"></i> Detener</span>
                            ` : `
                                <div class="text-5xl font-mono font-bold ${isFlagged ? 'text-red-400' : 'text-emerald-400'} mb-1">${formatTime(walk.duration)}</div>
                                <div class="text-slate-400 text-sm"><i class="ph ph-check-circle"></i> Completado</div>
                                <div class="text-xs mt-1 text-slate-500">por ${walk.completedBy || walk.walker}</div>
                                ${isFlagged ? `<div class="text-xs font-bold text-red-500 mt-2 bg-red-900/30 px-2 py-1 rounded-full"><i class="ph ph-warning"></i> Tiempo Insuficiente</div>` : ''}
                            `}
                        </button>

                        <div class="mt-8 space-y-3">
                            ${walk.status !== 'completed' && (walk.walker === state.currentUser.username || state.currentUser.role === 'admin') ? `
                                <button onclick="openSwapModal('${dateKey}', '${walkId}')" class="glass-button w-full p-4 rounded-2xl text-slate-300 font-semibold flex items-center justify-center gap-2">
                                    <i class="ph ph-arrows-left-right text-xl text-indigo-400"></i> ${state.currentUser.role === 'admin' ? 'Forzar Cambio (Admin)' : 'Solicitar Cambio de Turno'}
                                </button>
                            ` : ''}

                            ${walk.status === 'completed' && state.currentUser.role === 'admin' ? `
                                <div class="bg-black/40 border border-purple-500/30 rounded-2xl p-4 text-left">
                                    <h4 class="text-xs font-bold text-purple-400 uppercase mb-3 flex items-center gap-1"><i class="ph ph-shield-star"></i> Opciones de Admin</h4>
                                    <div class="flex gap-2 mb-3">
                                        <input type="text" id="adminTimeOverride" placeholder="HH:MM:SS" value="${formatTime(walk.duration)}" class="flex-1 bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm text-white font-mono text-center focus:outline-none focus:border-purple-500">
                                        <button onclick="adminSaveTime('${dateKey}', '${walkId}')" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-xl text-sm font-bold transition-colors">Guardar</button>
                                    </div>
                                    <button onclick="adminResetTimer('${dateKey}', '${walkId}')" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 py-2 rounded-xl text-sm font-bold flex items-center justify-center gap-2 transition-all">
                                        <i class="ph ph-arrow-counter-clockwise"></i> Restablecer Cronómetro
                                    </button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;

            if (walk.status === 'active') {
                updateTimerDisplay(); 
                clearInterval(timerDisplayInterval);
                timerDisplayInterval = setInterval(updateTimerDisplay, 1000);
            }
        }

        function updateTimerDisplay() {
            const display = document.getElementById('timerDisplay');
            if (display && state.activeTimerStart) {
                const now = Math.floor(Date.now() / 1000);
                const elapsed = now - state.activeTimerStart;
                display.innerText = formatTime(elapsed);
            }
        }

        function toggleTimer(dateKey, walkId) {
            const walk = state.walks[dateKey].find(w => w.id === walkId);
            if (!walk || walk.status === 'completed') return;

            if (walk.status === 'pending') {
                const isToday = dateKey === formatDateKey(new Date());
                if (!isToday) {
                    alert("Solo puedes iniciar el cronómetro para los paseos de hoy.");
                    return;
                }
                if (state.activeTimerId) {
                    alert("Ya hay un paseo en curso.");
                    return;
                }
                walk.status = 'active';
                state.activeTimerId = walkId;
                state.activeTimerStart = Math.floor(Date.now() / 1000);
                saveData();
                openTimerModal(dateKey, walkId);
            } else if (walk.status === 'active') {
                clearInterval(timerDisplayInterval);
                const now = Math.floor(Date.now() / 1000);
                const elapsed = now - state.activeTimerStart;
                
                walk.duration = elapsed;
                walk.status = 'completed';
                walk.completedBy = state.currentUser.username;
                state.activeTimerId = null;
                state.activeTimerStart = null;
                
                let minReqSeconds = walk.type === 'Corto' ? MIN_SHORT_WALK : MIN_LONG_WALK;
                if (walk.duration < minReqSeconds) {
                    notifyAdmins(`⚠️ [ALERTA] El paseo asignado a ${walk.walker} (${walk.type}) duró solo ${Math.floor(walk.duration/60)} minutos el ${dateKey} a las ${walk.time}.`);
                }
                saveData();
                openTimerModal(dateKey, walkId);
            }
        }

        function adminSaveTime(dateKey, walkId) {
            const walk = state.walks[dateKey].find(w => w.id === walkId);
            const val = document.getElementById('adminTimeOverride').value;
            
            const parts = val.split(':').reverse();
            let seconds = 0;
            if (parts[0]) seconds += parseInt(parts[0], 10) || 0;
            if (parts[1]) seconds += (parseInt(parts[1], 10) || 0) * 60;
            if (parts[2]) seconds += (parseInt(parts[2], 10) || 0) * 3600;

            walk.duration = seconds;
            saveData();
            openTimerModal(dateKey, walkId);
        }

        function adminResetTimer(dateKey, walkId) {
            const walk = state.walks[dateKey].find(w => w.id === walkId);
            walk.status = 'pending';
            walk.duration = 0;
            walk.completedBy = null;
            saveData();
            openTimerModal(dateKey, walkId);
        }

        function openSwapModal(originDateKey, originWalkId) {
            const originWalk = state.walks[originDateKey].find(w => w.id === originWalkId);
            let possibleSwaps = [];
            let checkDate = new Date(); 
            
            for (let i = 0; i < 14; i++) {
                const dKey = formatDateKey(checkDate);
                const dayOfWeek = checkDate.getDay();

                if (!state.walks[dKey]) {
                    const defaultForDay = state.defaultSchedule[dayOfWeek] || [];
                    if (defaultForDay.length > 0) {
                        state.walks[dKey] = defaultForDay.map(d => ({
                            id: generateId(), time: d.time, walker: d.walker, type: d.type, status: 'pending', duration: 0
                        }));
                    }
                }

                (state.walks[dKey] || []).forEach(w => {
                    if (w.status === 'pending' && w.type === originWalk.type && w.id !== originWalk.id) {
                        if (state.currentUser.role === 'admin' || w.walker !== state.currentUser.username) {
                            possibleSwaps.push({ dateKey: dKey, walk: w });
                        }
                    }
                });
                checkDate.setDate(checkDate.getDate() + 1);
            }
            
            saveData(); 

            const modalRoot = document.getElementById('modal-root');
            modalRoot.innerHTML = `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div class="absolute inset-0 modal-overlay" onclick="closeModal()"></div>
                    <div class="glass-panel w-full max-w-md rounded-3xl p-6 relative z-10 animate-fade-in text-left border border-indigo-500/30 flex flex-col max-h-[80vh]">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-xl font-bold text-white">Cambiar Turno</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="ph ph-x text-xl"></i></button>
                        </div>
                        
                        <p class="text-sm text-slate-400 mb-4">Selecciona un paseo equivalente (Tipo ${originWalk.type}) por el que quieras intercambiar tu turno del <strong class="text-indigo-300">${originDateKey} a las ${originWalk.time}</strong>.</p>
                        
                        <div class="overflow-y-auto pr-2 space-y-2 flex-1">
                            ${possibleSwaps.length === 0 ? `
                                <div class="text-center p-6 text-slate-500 text-sm">No hay paseos compatibles disponibles.</div>
                            ` : possibleSwaps.map(s => `
                                <div onclick="processSwap('${originDateKey}', '${originWalkId}', '${s.dateKey}', '${s.walk.id}', '${s.walk.walker}')" class="glass-button p-3 rounded-xl cursor-pointer flex justify-between items-center border border-white/5 hover:border-indigo-400">
                                    <div>
                                        <div class="text-white font-bold text-sm">${s.dateKey}</div>
                                        <div class="text-xs text-slate-400 mt-0.5"><i class="ph ph-clock"></i> ${s.walk.time} - <i class="ph ph-user"></i> ${s.walk.walker}</div>
                                    </div>
                                    <i class="ph ph-arrows-left-right text-indigo-400 text-lg"></i>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function processSwap(originDateKey, originWalkId, targetDateKey, targetWalkId, targetUser) {
            const originWalk = state.walks[originDateKey].find(w => w.id === originWalkId);
            const targetWalk = state.walks[targetDateKey].find(w => w.id === targetWalkId);

            const detailsOrigin = `${originDateKey} a las ${originWalk.time} (${originWalk.type})`;
            const detailsTarget = `${targetDateKey} a las ${targetWalk.time} (${targetWalk.type})`;

            if (state.currentUser.role === 'admin') {
                const tempWalker = originWalk.walker;
                originWalk.walker = targetWalk.walker;
                targetWalk.walker = tempWalker;
                
                addNotification(originWalk.walker, 'info', `El Admin reasignó tu paseo: Ahora tienes el ${detailsOrigin}.`);
                if(originWalk.walker !== targetWalk.walker) {
                    addNotification(targetWalk.walker, 'info', `El Admin reasignó tu paseo: Ahora tienes el ${detailsTarget}.`);
                }
                saveData();
                closeModal();
            } else {
                const reqId = generateId();
                state.swapRequests.push({
                    id: reqId, fromUser: state.currentUser.username, toUser: targetUser,
                    fromDate: originDateKey, toDate: targetDateKey, fromWalkId: originWalkId, toWalkId: targetWalkId, status: 'pending'
                });
                
                addNotification(targetUser, 'swap_req', `${state.currentUser.username} propone un cambio: Hará tu paseo del ${detailsTarget} si haces el suyo del ${detailsOrigin}.`, reqId);
                saveData();
                closeModal();
                alert("Solicitud enviada mediante la nube.");
            }
        }

        function handleSwapResponse(reqId, accepted) {
            const req = state.swapRequests.find(r => r.id === reqId);
            if (!req) return;

            req.status = accepted ? 'accepted' : 'rejected';
            
            if (accepted) {
                const w1 = (state.walks[req.fromDate] || []).find(w => w.id === req.fromWalkId);
                const w2 = (state.walks[req.toDate] || []).find(w => w.id === req.toWalkId);
                
                if (w1 && w2 && w1.status === 'pending' && w2.status === 'pending') {
                    w1.walker = req.toUser;
                    w2.walker = req.fromUser;
                    
                    addNotification(req.fromUser, 'success', `${req.toUser} ha ACEPTADO el cambio. Ahora haces el paseo del ${req.toDate} a las ${w2.time}.`);
                    addNotification(req.toUser, 'success', `Aceptaste el cambio. Ahora haces el paseo del ${req.fromDate} a las ${w1.time}.`);
                } else {
                    addNotification(req.fromUser, 'alert', `El cambio con ${req.toUser} falló porque un paseo ya no está disponible.`);
                }
            } else {
                addNotification(req.fromUser, 'alert', `${req.toUser} ha RECHAZADO tu propuesta de cambio.`);
            }

            state.swapRequests = state.swapRequests.filter(r => r.id !== reqId);
            const notif = state.notifications.find(n => n.relatedReqId === reqId);
            if(notif) notif.relatedReqId = null; 

            saveData();
            openNotifications(); 
        }

        function openNotifications() {
            const modalRoot = document.getElementById('modal-root');
            let myNotifs = state.notifications.filter(n => n.userId === state.currentUser.username);
            myNotifs.forEach(n => n.read = true);
            saveData();
            
            modalRoot.innerHTML = `
                <div class="fixed inset-0 z-50 flex justify-end p-4 sm:p-6">
                    <div class="absolute inset-0 modal-overlay" onclick="closeModal()"></div>
                    <div class="glass-panel w-full max-w-sm rounded-3xl p-6 relative z-10 animate-fade-in text-left border border-indigo-500/30 h-full flex flex-col shadow-2xl">
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-xl font-bold text-white flex items-center gap-2"><i class="ph ph-bell text-indigo-400"></i> Notificaciones</h3>
                            <button onclick="closeModal()" class="text-slate-400 hover:text-white bg-white/5 p-2 rounded-xl"><i class="ph ph-x"></i></button>
                        </div>
                        
                        <div class="overflow-y-auto space-y-3 flex-1 pr-2">
                            ${myNotifs.length === 0 ? `
                                <div class="text-center p-6 text-slate-500 text-sm">No tienes notificaciones.</div>
                            ` : myNotifs.map(n => {
                                const icons = { alert: 'ph-warning text-red-400', info: 'ph-info text-blue-400', success: 'ph-check-circle text-emerald-400', swap_req: 'ph-arrows-left-right text-purple-400' };
                                const bgs = { alert: 'bg-red-900/10 border-red-500/20', info: 'bg-blue-900/10 border-blue-500/20', success: 'bg-emerald-900/10 border-emerald-500/20', swap_req: 'bg-purple-900/10 border-purple-500/20' };
                                
                                return `
                                <div class="p-4 rounded-2xl border ${bgs[n.type] || 'bg-white/5 border-white/10'}">
                                    <div class="flex gap-3">
                                        <i class="ph ${icons[n.type] || 'ph-bell'} text-xl mt-0.5"></i>
                                        <div>
                                            <p class="text-sm text-slate-300">${n.message}</p>
                                            <div class="text-xs text-slate-500 mt-2">${new Date(n.timestamp).toLocaleString('es-ES')}</div>
                                            
                                            ${n.type === 'swap_req' && n.relatedReqId ? `
                                                <div class="flex gap-2 mt-3">
                                                    <button onclick="handleSwapResponse('${n.relatedReqId}', false)" class="flex-1 py-2 px-3 rounded-xl bg-red-500/20 text-red-400 hover:bg-red-500/30 text-xs font-bold transition-colors border border-red-500/30">Rechazar</button>
                                                    <button onclick="handleSwapResponse('${n.relatedReqId}', true)" class="flex-1 py-2 px-3 rounded-xl bg-emerald-500/20 text-emerald-400 hover:bg-emerald-500/30 text-xs font-bold transition-colors border border-emerald-500/30">Aceptar</button>
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStats() {
            const stats = {};
            state.users.forEach(u => {
                stats[u.username] = { minutes: 0, count: 0, name: u.username };
            });

            Object.values(state.walks).forEach(dayWalks => {
                dayWalks.forEach(walk => {
                    if (walk.status === 'completed') {
                        const walker = walk.walker;
                        if (!stats[walker]) stats[walker] = { minutes: 0, count: 0, name: walker };
                        stats[walker].minutes += Math.floor(walk.duration / 60);
                        stats[walker].count += 1;
                    }
                });
            });

            const usersData = Object.values(stats).filter(u => u.count > 0 || state.users.find(x => x.username === u.name));
            const byMinutes = [...usersData].sort((a, b) => b.minutes - a.minutes);
            const byCount = [...usersData].sort((a, b) => b.count - a.count);

            const maxMins = Math.max(...usersData.map(u => u.minutes), 1);
            const maxCount = Math.max(...usersData.map(u => u.count), 1);

            return `
                <div class="space-y-8 text-left animate-fade-in">
                    <div class="glass-panel p-6 sm:p-8 rounded-3xl relative overflow-hidden">
                        <div class="absolute -right-10 -top-10 opacity-5"><i class="ph ph-chart-polar text-9xl"></i></div>
                        <h3 class="text-2xl font-bold text-white mb-2 relative z-10 flex items-center gap-2"><i class="ph ph-chart-bar text-indigo-400"></i> Estadísticas Globales</h3>
                        <p class="text-slate-400 text-sm mb-8 relative z-10">Rendimiento histórico sincronizado en la nube.</p>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 relative z-10">
                            <div class="bg-black/30 p-5 sm:p-6 rounded-2xl border border-white/5 shadow-inner">
                                <h4 class="text-sm font-bold text-indigo-400 uppercase tracking-wider mb-6 flex items-center gap-2">
                                    <i class="ph ph-clock text-lg"></i> Minutos Totales
                                </h4>
                                <div class="space-y-5">
                                    ${byMinutes.map(u => {
                                        const pct = (u.minutes / maxMins) * 100;
                                        return `
                                        <div>
                                            <div class="flex justify-between text-xs mb-1.5">
                                                <span class="text-white font-medium">${u.name}</span>
                                                <span class="text-indigo-300 font-bold">${u.minutes} min</span>
                                            </div>
                                            <div class="w-full bg-slate-900 rounded-full h-3 overflow-hidden border border-white/5">
                                                <div class="bg-gradient-to-r from-indigo-600 to-indigo-400 h-3 rounded-full shadow-[0_0_10px_rgba(79,70,229,0.5)] transition-all duration-1000 ease-out" style="width: ${pct}%"></div>
                                            </div>
                                        </div>`;
                                    }).join('')}
                                </div>
                            </div>

                            <div class="bg-black/30 p-5 sm:p-6 rounded-2xl border border-white/5 shadow-inner">
                                <h4 class="text-sm font-bold text-emerald-400 uppercase tracking-wider mb-6 flex items-center gap-2">
                                    <i class="ph ph-hash text-lg"></i> Cantidad de Paseos
                                </h4>
                                <div class="space-y-5">
                                    ${byCount.map(u => {
                                        const pct = (u.count / maxCount) * 100;
                                        return `
                                        <div>
                                            <div class="flex justify-between text-xs mb-1.5">
                                                <span class="text-white font-medium">${u.name}</span>
                                                <span class="text-emerald-300 font-bold">${u.count} paseos</span>
                                            </div>
                                            <div class="w-full bg-slate-900 rounded-full h-3 overflow-hidden border border-white/5">
                                                <div class="bg-gradient-to-r from-emerald-600 to-emerald-400 h-3 rounded-full shadow-[0_0_10px_rgba(16,185,129,0.5)] transition-all duration-1000 ease-out" style="width: ${pct}%"></div>
                                            </div>
                                        </div>`;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAdmin() {
            if (state.currentUser.role !== 'admin') return '<p class="text-center text-red-500">Acceso denegado.</p>';
            
            const daysMap = { 1: 'Lunes', 2: 'Martes', 3: 'Miércoles', 4: 'Jueves', 5: 'Viernes', 6: 'Sábado', 0: 'Domingo' };
            const weekdayKeys = [1, 2, 3, 4, 5];
            const weekendKeys = [6, 0];

            function renderColumn(dayNum) {
                const slots = state.defaultSchedule[dayNum] || [];
                slots.sort((a, b) => a.time.localeCompare(b.time));
                
                return `
                    <div class="bg-black/20 p-3 rounded-2xl border border-white/5 min-w-[200px] flex-1">
                        <h4 class="text-sm font-bold text-slate-300 text-center mb-4 uppercase tracking-wider">${daysMap[dayNum]}</h4>
                        <div class="space-y-2 mb-3">
                            ${slots.map(s => `
                                <div class="bg-white/5 p-2 rounded-xl text-xs border border-white/10 relative group">
                                    <div class="font-bold text-indigo-300">${s.time} <span class="text-slate-500 font-normal ml-1">(${s.type})</span></div>
                                    <div class="text-slate-300"><i class="ph ph-user"></i> ${s.walker}</div>
                                    <button onclick="deleteDefaultSlot(${dayNum}, '${s.id}')" class="absolute top-2 right-2 text-red-400 opacity-0 group-hover:opacity-100 transition-opacity"><i class="ph ph-trash"></i></button>
                                </div>
                            `).join('')}
                        </div>
                        <button onclick="openDefaultSlotModal(${dayNum})" class="w-full py-2 bg-white/5 hover:bg-white/10 rounded-xl text-xs font-semibold text-slate-400 transition-colors border border-dashed border-white/20">
                            + Añadir
                        </button>
                    </div>
                `;
            }

            return `
                <div class="space-y-8 text-left animate-fade-in">
                    <div class="glass-panel p-6 rounded-3xl border border-indigo-500/20">
                        <h3 class="text-xl font-bold text-white mb-6 flex items-center gap-2"><i class="ph ph-users text-indigo-400"></i> Gestión de Usuarios</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="md:col-span-1 bg-black/30 p-5 rounded-2xl border border-white/5 h-fit">
                                <h4 class="text-sm font-bold text-slate-300 mb-4 uppercase tracking-wider">Crear Usuario</h4>
                                <form onsubmit="handleCreateUser(event)" class="space-y-3">
                                    <input type="text" id="newUsername" placeholder="Nombre" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                                    <input type="password" inputmode="numeric" pattern="[0-9]*" id="newPin" placeholder="PIN Numérico" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                                    <select id="newRole" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                                        <option value="user">Paseador (Usuario)</option>
                                        <option value="admin">Administrador</option>
                                    </select>
                                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-xl text-sm transition-colors mt-2">Guardar Usuario</button>
                                </form>
                            </div>

                            <div class="md:col-span-2 bg-black/30 p-5 rounded-2xl border border-white/5">
                                <h4 class="text-sm font-bold text-slate-300 mb-4 uppercase tracking-wider">Lista de Usuarios</h4>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    ${state.users.map(u => `
                                        <div class="flex items-center justify-between p-3 bg-white/5 rounded-xl border border-white/10">
                                            <div class="flex items-center gap-3">
                                                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-slate-700 to-slate-800 flex items-center justify-center">
                                                    <i class="ph ph-${u.role === 'admin' ? 'shield-star text-indigo-400' : 'user text-slate-400'}"></i>
                                                </div>
                                                <div>
                                                    <div class="text-sm font-bold text-white">${u.username}</div>
                                                    <div class="text-xs text-slate-500">${u.role}</div>
                                                </div>
                                            </div>
                                            <div class="flex gap-2">
                                                <button onclick="openResetPinModal('${u.username}')" class="p-1.5 text-slate-400 hover:text-blue-400 bg-white/5 hover:bg-white/10 rounded-lg transition-colors" title="Restablecer PIN">
                                                    <i class="ph ph-key text-lg"></i>
                                                </button>
                                                ${u.username !== state.currentUser.username ? `
                                                    <button onclick="deleteUser('${u.username}')" class="p-1.5 text-slate-400 hover:text-red-400 bg-white/5 hover:bg-white/10 rounded-lg transition-colors">
                                                        <i class="ph ph-trash text-lg"></i>
                                                    </button>
                                                ` : ''}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="glass-panel p-6 rounded-3xl border border-purple-500/20">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6">
                            <h3 class="text-xl font-bold text-white flex items-center gap-2"><i class="ph ph-calendar-plus text-purple-400"></i> Horarios Predeterminados</h3>
                            <p class="text-xs text-slate-400 mt-1 sm:mt-0 max-w-sm">Estos paseos se añadirán automáticamente al calendario cada semana.</p>
                        </div>
                        
                        <h4 class="text-sm font-bold text-indigo-400 mb-3 mt-6 uppercase tracking-wider flex items-center gap-2"><i class="ph ph-briefcase"></i> Días Laborables</h4>
                        <div class="flex overflow-x-auto gap-4 pb-4 snap-x">
                            ${weekdayKeys.map(d => renderColumn(d)).join('')}
                        </div>

                        <h4 class="text-sm font-bold text-emerald-400 mb-3 mt-6 uppercase tracking-wider flex items-center gap-2"><i class="ph ph-martini"></i> Fin de Semana</h4>
                        <div class="flex overflow-x-auto gap-4 pb-4 snap-x">
                            ${weekendKeys.map(d => renderColumn(d)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function handleCreateUser(e) {
            e.preventDefault();
            const u = document.getElementById('newUsername').value.trim();
            const p = document.getElementById('newPin').value.trim();
            const r = document.getElementById('newRole').value;
            
            if (state.users.find(x => x.username.toLowerCase() === u.toLowerCase())) {
                alert('El usuario ya existe');
                return;
            }
            
            state.users.push({ username: u, pin: p, role: r });
            saveData();
        }

        function deleteUser(username) {
            state.users = state.users.filter(u => u.username !== username);
            saveData();
        }

        function openResetPinModal(username) {
            const modalRoot = document.getElementById('modal-root');
            modalRoot.innerHTML = `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div class="absolute inset-0 modal-overlay" onclick="closeModal()"></div>
                    <div class="glass-panel w-full max-w-sm rounded-3xl p-6 relative z-10 animate-fade-in text-left border border-blue-500/30">
                        <h3 class="text-xl font-bold text-white mb-2">Restablecer PIN</h3>
                        <p class="text-sm text-slate-400 mb-4">Nuevo PIN numérico para <strong class="text-blue-300">${username}</strong></p>
                        <input type="password" inputmode="numeric" pattern="[0-9]*" id="resetPinValue" placeholder="Escribe el nuevo PIN" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 mb-4">
                        <div class="flex gap-3">
                            <button onclick="closeModal()" class="flex-1 py-3 bg-white/5 hover:bg-white/10 rounded-xl text-sm font-bold text-slate-300 transition-colors">Cancelar</button>
                            <button onclick="saveResetPin('${username}')" class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl text-sm font-bold text-white transition-colors shadow-lg shadow-blue-500/30">Guardar</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveResetPin(username) {
            const newPin = document.getElementById('resetPinValue').value.trim();
            if(!newPin) return;

            const user = state.users.find(u => u.username === username);
            if(user) {
                user.pin = newPin;
                saveData();
                closeModal();
            }
        }

        function openDefaultSlotModal(dayNum) {
            const modalRoot = document.getElementById('modal-root');
            const usersOpts = state.users.map(u => `<option value="${u.username}">${u.username}</option>`).join('');
            const daysMap = { 1: 'Lunes', 2: 'Martes', 3: 'Miércoles', 4: 'Jueves', 5: 'Viernes', 6: 'Sábado', 0: 'Domingo' };

            modalRoot.innerHTML = `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
                    <div class="absolute inset-0 modal-overlay" onclick="closeModal()"></div>
                    <div class="glass-panel w-full max-w-sm rounded-3xl p-6 relative z-10 animate-fade-in text-left border border-purple-500/30">
                        <h3 class="text-xl font-bold text-white mb-1">Añadir Predeterminado</h3>
                        <p class="text-sm text-slate-400 mb-4">Fijar paseo para todos los <strong class="text-purple-300">${daysMap[dayNum]}</strong></p>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Hora</label>
                                <input type="time" id="defTime" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-purple-500 focus:outline-none" required>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Paseador</label>
                                <select id="defWalker" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-purple-500 focus:outline-none">
                                    ${usersOpts}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1 uppercase tracking-wider">Tipo</label>
                                <select id="defType" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:border-purple-500 focus:outline-none">
                                    <option value="Corto">Corto</option>
                                    <option value="Largo">Largo</option>
                                </select>
                            </div>
                            <div class="pt-2 flex gap-3">
                                <button onclick="closeModal()" class="flex-1 py-3 rounded-xl text-slate-300 bg-white/5 hover:bg-white/10 font-bold transition-all">Cancelar</button>
                                <button onclick="saveDefaultSlot(${dayNum})" class="flex-1 py-3 rounded-xl text-white bg-purple-600 hover:bg-purple-500 font-bold shadow-lg shadow-purple-500/30 transition-all">Guardar</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveDefaultSlot(dayNum) {
            const time = document.getElementById('defTime').value;
            const walker = document.getElementById('defWalker').value;
            const type = document.getElementById('defType').value;
            
            if (!time) return;

            if (!state.defaultSchedule[dayNum]) state.defaultSchedule[dayNum] = [];
            state.defaultSchedule[dayNum].push({ id: generateId(), time, walker, type });
            
            if (walker !== state.currentUser.username) {
                const daysMap = { 1: 'Lunes', 2: 'Martes', 3: 'Miércoles', 4: 'Jueves', 5: 'Viernes', 6: 'Sábado', 0: 'Domingo' };
                addNotification(walker, 'info', `Se te asignó un paseo recurrente (${type}) todos los ${daysMap[dayNum]} a las ${time}.`);
            }

            saveData();
            closeModal();
        }

        function deleteDefaultSlot(dayNum, slotId) {
            const slot = state.defaultSchedule[dayNum].find(s => s.id === slotId);
            if (slot && slot.walker !== state.currentUser.username) {
                const daysMap = { 1: 'Lunes', 2: 'Martes', 3: 'Miércoles', 4: 'Jueves', 5: 'Viernes', 6: 'Sábado', 0: 'Domingo' };
                addNotification(slot.walker, 'alert', `Se ha cancelado tu paseo recurrente de los ${daysMap[dayNum]} a las ${slot.time}.`);
            }
            
            state.defaultSchedule[dayNum] = state.defaultSchedule[dayNum].filter(s => s.id !== slotId);
            saveData();
        }

        function closeModal() {
            document.getElementById('modal-root').innerHTML = '';
            if (state.activeTimerId) {
                clearInterval(timerDisplayInterval);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initFirebase();
        });

        // Soporte de teclado numérico para PIN
        window.addEventListener('keydown', (e) => {
            if (state.view === 'login' && loginState.step === 'pin') {
                if (e.key >= '0' && e.key <= '9') handlePinInput(e.key);
                else if (e.key === 'Backspace') handlePinBackspace();
                else if (e.key === 'Enter') handlePinSubmit();
            }
        });

        // Exponer funciones necesarias al scope global
        window.handleFirstAdmin = handleFirstAdmin;
        window.handleLoginUser = handleLoginUser;
        window.handlePinInput = handlePinInput;
        window.handlePinBackspace = handlePinBackspace;
        window.handlePinSubmit = handlePinSubmit;
        window.changeDay = changeDay;
        window.openAddWalkModal = openAddWalkModal;
        window.closeModal = closeModal;
        window.saveNewWalk = saveNewWalk;
        window.openTimerModal = openTimerModal;
        window.toggleTimer = toggleTimer;
        window.adminSaveTime = adminSaveTime;
        window.adminResetTimer = adminResetTimer;
        window.openSwapModal = openSwapModal;
        window.processSwap = processSwap;
        window.handleSwapResponse = handleSwapResponse;
        window.openNotifications = openNotifications;
        window.handleCreateUser = handleCreateUser;
        window.deleteUser = deleteUser;
        window.openResetPinModal = openResetPinModal;
        window.saveResetPin = saveResetPin;
        window.openDefaultSlotModal = openDefaultSlotModal;
        window.saveDefaultSlot = saveDefaultSlot;
        window.deleteDefaultSlot = deleteDefaultSlot;
        window.logout = logout;
    </script>
</body>
</html>
